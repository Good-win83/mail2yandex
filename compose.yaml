services:
  mail2yandex:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SMTP_HOST: "0.0.0.0"
      ADMIN_HOST: "0.0.0.0"
      ADMIN_ALLOW_REMOTE: "true"
    volumes:
      - ./data:/data
    ports:
      # SMTP is only active with INPUT_MODE=smtp or both.
      - "127.0.0.1:${SMTP_PORT:-8025}:${SMTP_PORT:-8025}"
      - "${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    security_opt:
      - no-new-privileges:true
